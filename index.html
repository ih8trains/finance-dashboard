<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый Дашборд</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #ffe600;
            --primary-hover: #e6cf00;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 16px;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 0; }
        
        /* Логин экран */
        #loginCard { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 360px; text-align: center; box-sizing: border-box; }
        #loginCard h2 { margin-top: 0; font-weight: 700; font-size: 24px; }
        input { width: 100%; padding: 14px; margin: 15px 0; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #9ca3af; }
        button { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 16px; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        
        /* Дашборд */
        #dashboard { display: none; max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 700; }
        .logout-btn { background: #fee2e2; color: #991b1b; padding: 8px 16px; border-radius: 8px; width: auto; font-size: 14px; }
        .logout-btn:hover { background: #fecaca; }

        /* Сетка KPI */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .kpi-card { background: var(--card-bg); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .kpi-title { color: var(--text-muted); font-size: 14px; font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .kpi-value { font-size: 32px; font-weight: 700; margin: 0; }
        .kpi-value.green { color: #10b981; }

        /* Сетка Графиков */
        .charts-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px; }
        .full-width-chart { grid-template-columns: 1fr; }
        .chart-card { background: var(--card-bg); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .chart-title { font-size: 18px; font-weight: 600; margin-top: 0; margin-bottom: 20px; color: var(--text-main); }
        .chart-container { position: relative; height: 300px; width: 100%; }

        /* Таблица */
        .table-container { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 24px; border-bottom: 1px solid var(--border); }
        th { background: #f9fafb; color: var(--text-muted); font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
        td { font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        .td-date { color: var(--text-muted); font-size: 13px; }
        .td-sum { font-weight: 600; }
        .td-cb { color: #10b981; font-size: 12px; font-weight: 600; background: #d1fae5; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-left: 8px; }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            th, td { padding: 12px 16px; }
        }
    </style>
</head>
<body>

    <!-- Логин -->
    <div id="loginCard">
        <h2>Аналитика</h2>
        <input type="password" id="passwordInput" placeholder="Магическое слово...">
        <button onclick="loadData()">Войти</button>
        <p id="errorMsg" style="color: #ef4444; display: none; margin-top: 15px; font-size: 14px;"></p>
    </div>

    <!-- Дашборд -->
    <div id="dashboard">
        <div class="header">
            <h1>📊 Обзор финансов</h1>
            <button class="logout-btn" onclick="location.reload()">Выйти</button>
        </div>

        <!-- KPI -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">Всего потрачено</div>
                <div class="kpi-value" id="kpiTotal">0 ₽</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Кэшбэк</div>
                <div class="kpi-value green" id="kpiCb">0 ₽</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Операций</div>
                <div class="kpi-value" id="kpiCount">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Средний чек</div>
                <div class="kpi-value" id="kpiAvg">0 ₽</div>
            </div>
        </div>

        <!-- Динамика по дням -->
        <div class="charts-grid full-width-chart">
            <div class="chart-card">
                <h3 class="chart-title">📈 Динамика расходов</h3>
                <div class="chart-container" style="height: 250px;">
                    <canvas id="timelineChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Бублик и Топ брендов -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3 class="chart-title">🧩 Структура (Категории)</h3>
                <div class="chart-container">
                    <canvas id="doughnutChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">🏆 Топ-10 мест</h3>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Последние операции -->
        <h3 class="chart-title" style="margin-top: 30px;">📝 Последние операции</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Категория</th>
                        <th>Описание</th>
                        <th>Сумма</th>
                    </tr>
                </thead>
                <tbody id="txTableBody">
                    <!-- Заполняется из JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ОТ GOOGLE SCRIPT!
        const API_URL = "https://script.google.com/macros/s/AKfycbzuhA9zufi1HOSvSF3q6l599aNIIWg6FV3k-hGV-teqFkQFQWh4uPzFIMZNBB3OrYguyA/exec"; 
        
        let charts = {}; // Хранилище инстансов графиков

        const formatMoney = (num) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(num);

        async function loadData() {
            const pass = document.getElementById('passwordInput').value;
            const btn = document.querySelector('#loginCard button');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.innerText = "Загрузка данных...";
            errorMsg.style.display = 'none';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ password: pass }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();

                if (result.status === "error") {
                    errorMsg.innerText = result.message;
                    errorMsg.style.display = 'block';
                    btn.innerText = "Войти";
                } else {
                    document.getElementById('loginCard').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    processAndRender(result.headers, result.data);
                }
            } catch (e) {
                errorMsg.innerText = "Ошибка сети. Проверь ссылку API.";
                errorMsg.style.display = 'block';
                btn.innerText = "Войти";
            }
        }

        function processAndRender(headers, rows) {
            // Индексы колонок (нечувствительны к регистру)
            const col = (name) => headers.findIndex(h => String(h).trim().toLowerCase() === name.toLowerCase());
            
            const iGroup = col('Моя группа');
            const iCat = col('Категория банка');
            const iSum = col('Сумма');
            const iCb = col('Кэшбэк');
            const iDate = col('Дата и время');
            const iBrand = col('Бренд');
            const iDesc = col('Описание');

            if (iSum === -1 || iDate === -1) {
                alert("Ошибка: В таблице нет обязательных столбцов 'Сумма' или 'Дата и время'.");
                return;
            }

            let totalSpent = 0;
            let totalCb = 0;
            let txCount = 0;
            
            let groupData = {};
            let brandData = {};
            let timelineData = {};
            let validRows = [];

            rows.forEach(row => {
                let rawSum = String(row[iSum]).replace(/\s/g, '').replace(',', '.');
                let sum = Math.abs(parseFloat(rawSum));
                
                if (isNaN(sum) || sum <= 0) return; // Пропускаем пустышки и пополнения

                let cb = parseFloat(String(row[iCb] || '0').replace(/\s/g, '').replace(',', '.'));
                cb = isNaN(cb) ? 0 : cb;

                // Если "Моя группа" пустая, берем "Категория банка"
                let group = String(row[iGroup] || "").trim();
                if (!group || group === "Не размечено" || group === "#REF!") {
                    group = String(row[iCat] || "Без категории").trim();
                }

                let brand = String(row[iBrand] || row[iDesc] || "Неизвестно").trim();
                let rawDate = String(row[iDate]); 
                let dateDay = rawDate.substring(0, 10); // Берем только DD.MM.YYYY

                // Аггрегация KPI
                totalSpent += sum;
                totalCb += cb;
                txCount++;

                // Аггрегация для графиков
                groupData[group] = (groupData[group] || 0) + sum;
                brandData[brand] = (brandData[brand] || 0) + sum;
                timelineData[dateDay] = (timelineData[dateDay] || 0) + sum;

                // Сохраняем очищенную строку для таблицы
                validRows.push({
                    dateRaw: rawDate,
                    date: dateDay,
                    group: group,
                    desc: brand,
                    sum: sum,
                    cb: cb
                });
            });

            // Обновляем KPI
            document.getElementById('kpiTotal').innerText = formatMoney(totalSpent);
            document.getElementById('kpiCb').innerText = formatMoney(totalCb);
            document.getElementById('kpiCount').innerText = txCount;
            document.getElementById('kpiAvg').innerText = txCount > 0 ? formatMoney(totalSpent / txCount) : "0 ₽";

            // Рендер Графиков
            renderDoughnut(groupData);
            renderBar(brandData);
            renderTimeline(timelineData);

            // Рендер Таблицы (последние 15 операций)
            renderTable(validRows.reverse().slice(0, 15));
        }

        // --- ФУНКЦИИ ОТРИСОВКИ ---
        const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f43f5e', '#84cc16', '#64748b', '#14b8a6'];

        function destroyChart(id) {
            if (charts[id]) charts[id].destroy();
        }

        function renderDoughnut(dataObj) {
            destroyChart('doughnut');
            const ctx = document.getElementById('doughnutChart').getContext('2d');
            
            // Сортируем от большего к меньшему
            const sorted = Object.entries(dataObj).sort((a, b) => b[1] - a[1]);
            
            charts['doughnut'] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: sorted.map(i => i[0]),
                    datasets: [{
                        data: sorted.map(i => i[1]),
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } } }
            });
        }

        function renderBar(dataObj) {
            destroyChart('bar');
            const ctx = document.getElementById('barChart').getContext('2d');
            
            // Топ 10
            const sorted = Object.entries(dataObj).sort((a, b) => b[1] - a[1]).slice(0, 10);

            charts['bar'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(i => i[0]),
                    datasets: [{
                        label: 'Потрачено (₽)',
                        data: sorted.map(i => i[1]),
                        backgroundColor: '#ffe600',
                        borderRadius: 6
                    }]
                },
                options: { 
                    indexAxis: 'y', 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false, grid: { display: false } }, y: { grid: { display: false } } }
                }
            });
        }

        function renderTimeline(dataObj) {
            destroyChart('timeline');
            const ctx = document.getElementById('timelineChart').getContext('2d');
            
            // Сортировка по дате (примитивно по ключам DD.MM.YYYY, если формат совпадает)
            // В идеале парсить Date, но оставим простым
            const labels = Object.keys(dataObj).reverse(); 
            const values = Object.values(dataObj).reverse();

            charts['timeline'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Траты по дням',
                        data: values,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#f3f4f6' }, border: { display: false } },
                        x: { grid: { display: false }, border: { display: false } }
                    }
                }
            });
        }

        function renderTable(rows) {
            const tbody = document.getElementById('txTableBody');
            tbody.innerHTML = '';
            
            rows.forEach(r => {
                const tr = document.createElement('tr');
                let cbHtml = r.cb > 0 ? `<span class="td-cb">+${r.cb} ₽ кэшбэк</span>` : '';
                
                tr.innerHTML = `
                    <td class="td-date">${r.dateRaw}</td>
                    <td><b>${r.group}</b></td>
                    <td>${r.desc}</td>
                    <td class="td-sum">${formatMoney(r.sum)} ${cbHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
